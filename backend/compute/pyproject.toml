[project]
name = "bestee-compute"
version = "0.1.0"
description = "Financial data toolkit and table-building DSL on top of the Massive API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "great-tables>=0.21.0",
    "hmmlearn>=0.3.3",
    "httpx>=0.28.1",
    "lightgbm>=4.6.0",
    "massive>=2.7.0",
    "numpy>=2.0",
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "ta-lib>=0.6.8",
]

[project.scripts]
bestee-compute = "bestee_compute.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bestee_compute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.1",
    "pre-commit>=4.0",
    "matplotlib>=3.11.0",
]
