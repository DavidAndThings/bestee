repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Animated gif assets are intentionally large (the UI uses multi-MB
        # gifs); keep the 500 KB guard for everything else.
        exclude: ^ui/src/assets/gifs/
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-compute
        name: ty check (compute)
        entry: bash -c 'cd compute && uvx ty check'
        language: system
        types: [python]
        files: ^compute/
        pass_filenames: false
      - id: ty-chat
        name: ty check (chat)
        entry: bash -c 'cd chat && uvx ty check'
        language: system
        types: [python]
        files: ^chat/
        pass_filenames: false
      - id: ty-queue
        name: ty check (queue)
        entry: bash -c 'cd queue && uvx ty check'
        language: system
        types: [python]
        files: ^queue/
        pass_filenames: false
      - id: eslint-ui
        name: eslint (ui)
        entry: bash -c 'cd ui && npm run lint'
        language: system
        files: ^ui/.*\.(ts|tsx)$
        pass_filenames: false
