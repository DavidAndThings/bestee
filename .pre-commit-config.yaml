repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Animated gif assets are intentionally large (the UI uses multi-MB
        # gifs); keep the 500 KB guard for everything else.
        exclude: ^ui/src/assets/gifs/
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-compute
        name: ty check (compute)
        entry: bash -c 'cd backend/compute && uv run --no-sync ty check'
        language: system
        types: [python]
        files: ^backend/compute/
        pass_filenames: false
      - id: ty-queue
        name: ty check (queue)
        entry: bash -c 'cd backend/queue && uv run --no-sync ty check'
        language: system
        types: [python]
        files: ^backend/queue/
        pass_filenames: false
      - id: ty-api
        name: ty check (api)
        entry: bash -c 'cd backend/api && uv run --no-sync ty check'
        language: system
        types: [python]
        files: ^backend/api/
        pass_filenames: false
      - id: eslint-ui
        name: eslint (ui)
        entry: bash -c 'cd ui && npm run lint'
        language: system
        files: ^ui/.*\.(ts|tsx)$
        pass_filenames: false
